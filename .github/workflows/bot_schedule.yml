name: Crypto RSI Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot.py

      - name: Save signals history (Anti-Spam)
        run: |
          if [ -f fast_signals_state.json ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Action"
            git add fast_signals_state.json
            git diff --staged --quiet || (git commit -m "Update signals state [skip ci]" && git push)
          fi
